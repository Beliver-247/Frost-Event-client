<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Center circle -->
  <circle cx="100" cy="100" r="8" fill="#D4AF37"/>
  
  <!-- Main axes -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="#4A90E2" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#4A90E2" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="160" y2="160" stroke="#4A90E2" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="40" x2="40" y2="160" stroke="#4A90E2" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Branch details on vertical axis -->
  <line x1="80" y1="35" x2="100" y2="50" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="35" x2="100" y2="50" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="165" x2="100" y2="150" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="165" x2="100" y2="150" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch details on horizontal axis -->
  <line x1="35" y1="80" x2="50" y2="100" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="120" x2="50" y2="100" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="80" x2="150" y2="100" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="120" x2="150" y2="100" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch details on diagonal axes -->
  <line x1="50" y1="35" x2="58" y2="58" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="58" y2="58" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="165" x2="142" y2="142" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="150" x2="142" y2="142" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  
  <line x1="150" y1="35" x2="142" y2="58" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="50" x2="142" y2="58" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="165" x2="58" y2="142" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="150" x2="58" y2="142" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Endpoint circles -->
  <circle cx="100" cy="20" r="6" fill="#D4AF37"/>
  <circle cx="100" cy="180" r="6" fill="#D4AF37"/>
  <circle cx="20" cy="100" r="6" fill="#D4AF37"/>
  <circle cx="180" cy="100" r="6" fill="#D4AF37"/>
  <circle cx="40" cy="40" r="6" fill="#D4AF37"/>
  <circle cx="160" cy="160" r="6" fill="#D4AF37"/>
  <circle cx="160" cy="40" r="6" fill="#D4AF37"/>
  <circle cx="40" cy="160" r="6" fill="#D4AF37"/>
</svg>
